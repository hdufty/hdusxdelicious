<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>美食探店 · 菜品上传与评价平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* 自定义星级悬停动画 */
    .star-btn { transition: transform 0.15s ease; }
    .star-btn:hover { transform: scale(1.2); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans">
  <!-- ========== 登录面板 ========== -->
  <div id="authPanel" class="bg-white border-b border-slate-200 py-3 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 flex flex-wrap items-center justify-between gap-3">
      <div id="authInfo"></div>
      <div id="authForm" class="flex gap-2 flex-wrap items-center"></div>
    </div>
  </div>

  <!-- 顶部导航栏 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🍜</span>
        <h1 class="text-xl font-bold text-slate-900 tracking-tight">食刻点评 · 店铺菜品库</h1>
      </div>
      <div class="flex items-center gap-2">
        <input
          type="text"
          id="searchInput"
          placeholder="搜索店铺名或菜品名..."
          class="w-full sm:w-64 px-3.5 py-2 text-sm bg-slate-100 border border-transparent rounded-lg focus:bg-white focus:border-orange-500 focus:outline-none transition"
        />
        <select
          id="sortSelect"
          class="px-3 py-2 text-sm bg-slate-100 border border-transparent rounded-lg focus:bg-white focus:border-orange-500 focus:outline-none cursor-pointer"
        >
          <option value="newest">最新发布</option>
          <option value="highest">评分最高</option>
          <option value="mostReviewed">评价最多</option>
        </select>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- 左侧：上传新菜品表单 -->
    <aside class="lg:col-span-4">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 sticky top-24">
        <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
          <span>➕</span> 上传店铺与菜品
        </h2>
        <div id="postTip" class="mb-3 text-sm text-red-500 hidden">请先登录，才能发布菜品</div>
        <form id="dishForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">店铺名称 *</label>
            <input
              type="text"
              id="shopName"
              required
              placeholder="例如：杭电二餐黄焖鸡"
              class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 focus:outline-none"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">菜品名称 *</label>
            <input
              type="text"
              id="dishName"
              required
              placeholder="例如：招牌香辣黄焖鸡（微辣）"
              class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 focus:outline-none"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">菜品图片链接（填图片URL）</label>
            <input
              type="text"
              id="dishImageUrl"
              placeholder="https://xxx.jpg"
              class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 focus:outline-none"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">初始评分 *</label>
            <div id="starSelector" class="flex items-center gap-1 text-2xl text-amber-400 select-none">
              <button type="button" data-val="1" class="star-btn">★</button>
              <button type="button" data-val="2" class="star-btn">★</button>
              <button type="button" data-val="3" class="star-btn">★</button>
              <button type="button" data-val="4" class="star-btn">★</button>
              <button type="button" data-val="5" class="star-btn">★</button>
              <span id="ratingText" class="text-xs text-slate-500 ml-2 font-medium">5 分 (力荐)</span>
            </div>
            <input type="hidden" id="initialRating" value="5" />
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">口味评价 *</label>
            <textarea
              id="initialComment"
              rows="3"
              required
              placeholder="写下你的真实体验：分量、价格、口味如何？"
              class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 focus:outline-none"
            ></textarea>
          </div>

          <button
            type="submit"
            id="submitDishBtn"
            class="w-full py-2.5 px-4 bg-orange-500 hover:bg-orange-600 active:bg-orange-700 text-white font-semibold text-sm rounded-lg shadow-sm transition cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed"
          >
            发布菜品与评价
          </button>
        </form>
      </div>
    </aside>

    <!-- 右侧：菜品展示与追加评价列表 -->
    <section class="lg:col-span-8 space-y-5">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold text-slate-900">全部菜品 (<span id="dishCount">0</span>)</h2>
      </div>

      <!-- 菜品卡片容器 -->
      <div id="dishList" class="space-y-5"></div>
    </section>

  </main>

  <script>
    // ========== 这里改成你自己的supabase信息 ==========
    const SUPABASE_URL = "https://eewjsxukpcokhazptwhm.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_RtMxCp9oXcLS3h8QNzYGQQ_Ym-9JC17";
    // ================================================

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let user = null;
    let isAdmin = false;

    // 评分文字映射
    const RATING_LABELS = {
      1: '1 分 (踩雷)',
      2: '2 分 (较差)',
      3: '3 分 (一般)',
      4: '4 分 (推荐)',
      5: '5 分 (力荐)'
    };

    // 星级选择器交互
    const starBtns = document.querySelectorAll('#starSelector .star-btn');
    const initialRatingInput = document.getElementById('initialRating');
    const ratingText = document.getElementById('ratingText');

    function updateStars(val) {
      initialRatingInput.value = val;
      ratingText.textContent = RATING_LABELS[val];
      starBtns.forEach(btn => {
        const btnVal = Number(btn.dataset.val);
        btn.classList.toggle('text-amber-400', btnVal <= val);
        btn.classList.toggle('text-slate-300', btnVal > val);
      });
    }
    starBtns.forEach(btn => {
      btn.addEventListener('click', () => updateStars(Number(btn.dataset.val)));
    });
    updateStars(5);

    // 计算平均分
    function getAvgRating(reviews) {
      if (!reviews.length) return 0;
      const sum = reviews.reduce((acc, r) => acc + r.rating, 0);
      return (sum / reviews.length).toFixed(1);
    }

    // 渲染星级图标
    function renderStarsHTML(score) {
      const fullStars = Math.round(score);
      return '★'.repeat(fullStars) + '<span class="text-slate-300">' + '★'.repeat(5 - fullStars) + '</span>';
    }

    // 防 XSS 转义
    function escapeHTML(str) {
      if(!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag]));
    }

    // 格式化时间
    function formatTime(isoStr) {
      const d = new Date(isoStr);
      return d.toLocaleString('zh-CN');
    }

    // 加载菜品+评价
    async function loadDishes() {
      const {data:dishes, error:dErr} = await supabase
        .from('dishes')
        .select('*, reviews(*)')
        .order('created_at', {asc:false});
      if(dErr) return console.error(dErr);
      renderDishes(dishes);
    }

    // 渲染列表
    function renderDishes(dishes) {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const sortBy = document.getElementById('sortSelect').value;
      const listEl = document.getElementById('dishList');

      let filtered = dishes.filter(d =>
        d.shop_name.toLowerCase().includes(keyword) ||
        d.dish_name.toLowerCase().includes(keyword)
      );

      if (sortBy === 'highest') {
        filtered.sort((a, b) => getAvgRating(b.reviews) - getAvgRating(a.reviews));
      } else if (sortBy === 'mostReviewed') {
        filtered.sort((a, b) => b.reviews.length - a.reviews.length);
      } else {
        filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      }

      document.getElementById('dishCount').textContent = filtered.length;

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div class="bg-white rounded-2xl p-12 text-center border border-slate-200 text-slate-400">
            <p class="text-4xl mb-2">🍽️</p>
            <p class="text-sm">没有找到匹配的菜品</p>
          </div>`;
        return;
      }

      listEl.innerHTML = filtered.map(dish => {
        const avg = getAvgRating(dish.reviews || []);
        // 权限：自己的 or 管理员，可以删
        const canEdit = user && (user.id === dish.user_id || isAdmin);
        return `
          <article class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 transition hover:shadow-md">
            <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4">
              <div class="space-y-1">
                <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-medium bg-orange-50 text-orange-700 border border-orange-200">
                  🏪 ${escapeHTML(dish.shop_name)}
                </span>
                <h3 class="text-xl font-bold text-slate-900 pt-1">${escapeHTML(dish.dish_name)}</h3>
                <div class="text-xs text-slate-400">发布者：${escapeHTML(dish.user_id.slice(0,12))} ${canEdit?'✅可管理':''}</div>
              </div>
              <div class="flex sm:flex-col items-baseline sm:items-end gap-2 sm:gap-0 shrink-0">
                <div class="flex items-center gap-1.5">
                  <span class="text-2xl font-extrabold text-orange-500">${avg}</span>
                  <span class="text-sm text-amber-400 tracking-tighter">${renderStarsHTML(avg)}</span>
                </div>
                <span class="text-xs text-slate-400">共 ${(dish.reviews||[]).length} 条评价</span>
                ${canEdit?`<button onclick="deleteDish('${dish.id}')" class="mt-2 text-xs text-red-500 hover:underline">删除这条菜品</button>`:''}
              </div>
            </div>

            ${dish.image ? `<img src="${escapeHTML(dish.image)}" alt="${escapeHTML(dish.dish_name)}" class="mt-4 w-full max-h-64 object-cover rounded-xl border border-slate-100" />` : ''}

            <!-- 评价列表 -->
            <div class="mt-5 pt-4 border-t border-slate-100 space-y-3">
              <h4 class="text-xs font-semibold uppercase tracking-wider text-slate-400">食客评价</h4>
              <div class="space-y-2.5 max-h-56 overflow-y-auto pr-1">
                ${(dish.reviews||[]).map(r => `
                  <div class="bg-slate-50 p-3 rounded-xl text-sm">
                    <div class="flex items-center justify-between mb-1">
                      <span class="font-semibold text-slate-700 text-xs">${escapeHTML(r.user_id.slice(0,12))}</span>
                      <div class="flex items-center gap-2">
                        <span class="text-amber-400 text-xs">${renderStarsHTML(r.rating)}</span>
                        <span class="text-slate-400 text-xs">${formatTime(r.created_at)}</span>
                      </div>
                    </div>
                    <p class="text-slate-600 leading-relaxed">${escapeHTML(r.comment)}</p>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- 追加评价表单 -->
            <form onsubmit="addReview(event, '${dish.id}')" class="mt-4 pt-3 border-t border-slate-100 flex flex-col sm:flex-row gap-2">
              <select name="rating" class="px-2.5 py-2 text-xs bg-slate-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500/30 cursor-pointer">
                <option value="5">⭐⭐⭐⭐⭐ 5分</option>
                <option value="4">⭐⭐⭐⭐ 4分</option>
                <option value="3">⭐⭐⭐ 3分</option>
                <option value="2">⭐⭐ 2分</option>
                <option value="1">⭐ 1分</option>
              </select>
              <input
                type="text"
                name="comment"
                required
                placeholder="${user?'写下追加评价...':'登录后才能写评价'}"
                class="flex-1 px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:border-orange-500"
                ${!user?'disabled':''}
              />
              <button
                type="submit"
                class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white text-xs font-medium rounded-lg transition cursor-pointer shrink-0 disabled:opacity-40"
                ${!user?'disabled':''}
              >
                发布评价
              </button>
            </form>
          </article>
        `;
      }).join('');
    }

    // 删除菜品
    window.deleteDish = async function(dishId) {
      if(!confirm('确定删除？')) return;
      await supabase.from('dishes').delete().eq('id', dishId);
      loadDishes();
    }

    // 提交新菜品
    document.getElementById('dishForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if(!user) return alert('请登录');
      const shopName = document.getElementById('shopName').value.trim();
      const dishName = document.getElementById('dishName').value.trim();
      const rating = Number(document.getElementById('initialRating').value);
      const comment = document.getElementById('initialComment').value.trim();
      const image = document.getElementById('dishImageUrl').value.trim();

      const {data:dish, errDish} = await supabase.from('dishes').insert({
        user_id: user.id,
        shop_name: shopName,
        dish_name: dishName,
        image: image || null
      }).select().single();
      if(errDish) return alert('发布菜品失败 '+errDish.message);

      // 同时插入第一条评价
      await supabase.from('reviews').insert({
        dish_id: dish.id,
        user_id: user.id,
        rating,
        comment
      })
      e.target.reset();
      updateStars(5);
      loadDishes();
    });

    // 追加评价
    window.addReview = async function(e, dishId) {
      e.preventDefault();
      if(!user) return alert('请登录');
      const form = e.target;
      const rating = Number(form.rating.value);
      const comment = form.comment.value.trim();
      if (!comment) return;

      const {err} = await supabase.from('reviews').insert({
        dish_id:dishId,
        user_id:user.id,
        rating,
        comment
      })
      if(err) alert(err.message);
      loadDishes();
    };

    // 搜索与排序监听
    document.getElementById('searchInput').addEventListener('input', ()=>loadDishes());
    document.getElementById('sortSelect').addEventListener('change', ()=>loadDishes());

    // 登录渲染
    function renderAuth() {
      const infoEl = document.getElementById('authInfo');
      const formEl = document.getElementById('authForm');
      const postTip = document.getElementById('postTip');
      const submitBtn = document.getElementById('submitDishBtn');
      if(user){
        infoEl.innerHTML = `<span class="font-medium">✅ 已登录：${user.email}</span> ${isAdmin?'<span class="text-orange-500 font-bold">[管理员]</span>':''}`;
        formEl.innerHTML = `<button onclick="signOut()" class="px-3 py-1.5 bg-slate-700 text-white rounded-lg text-sm">退出登录</button>`;
        postTip.classList.add('hidden');
        submitBtn.disabled = false;
      }else{
        infoEl.innerHTML = `<span class="text-slate-500">🔐 未登录（只能浏览）</span>`;
        formEl.innerHTML = `
          <input id="loginEmail" placeholder="邮箱" class="px-2 py-1.5 border rounded text-sm">
          <input id="loginPwd" type="password" placeholder="密码" class="px-2 py-1.5 border rounded text-sm">
          <button onclick="signIn()" class="px-3 py-1.5 bg-orange-500 text-white rounded-lg text-sm">登录</button>
          <button onclick="signUp()" class="px-3 py-1.5 bg-slate-200 rounded-lg text-sm">注册</button>
        `;
        postTip.classList.remove('hidden');
        submitBtn.disabled = true;
      }
    }

    window.signIn = async function(){
      const email = document.getElementById('loginEmail').value;
      const pwd = document.getElementById('loginPwd').value;
      const {data,err}=await supabase.auth.signInWithPassword({email,password:pwd})
      if(err) alert(err.message);
    }
    window.signUp = async function(){
      const email = document.getElementById('loginEmail').value;
      const pwd = document.getElementById('loginPwd').value;
      const {data,err}=await supabase.auth.signUp({email,password:pwd})
      if(err) alert(err.message);
      else alert('注册成功，请登录');
    }
    window.signOut = async function(){
      await supabase.auth.signOut();
    }

    // 检查是否管理员
    async function checkAdmin(uid){
      const {data} = await supabase.from('admins').select().eq('user_id',uid).maybeSingle();
      isAdmin = !!data;
    }

    // 监听登录状态
    supabase.auth.onAuthStateChange(async (event,session)=>{
      if(session?.user){
        user = session.user;
        await checkAdmin(user.id);
      }else{
        user=null;
        isAdmin=false;
      }
      renderAuth();
      loadDishes();
    })

    // 初始化
    renderAuth();
    loadDishes();
  </script>
</body>
</html>
