<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>菜品评价</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}
.container{max-width:900px;margin:20px auto;padding:0 16px}
.form-card{border:1px solid #ddd;padding:16px;border-radius:10px;margin-bottom:20px}
input,textarea,select{width:100%;padding:8px;margin:6px 0;border:1px solid #ccc;border-radius:6px}
button{padding:9px 14px;border:none;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer;margin:4px}
.btn-logout{background:#dc2626}
.item{border:1px solid #eee;padding:14px;border-radius:8px;margin:12px 0}
.modal{position:fixed;inset:0;background:#0005;display:flex;align-items:center;justify-content:center;display:none}
.modal-box{background:#fff;padding:20px;border-radius:10px;width:360px}
</style>
</head>
<body>
<div class="container">
  <div id="user-bar"></div>

  <div class="form-card">
    <h3>添加菜品</h3>
    <input id="shop" placeholder="店铺名称">
    <input id="dish" placeholder="菜品名称">
    <button onclick="addDish()">发布菜品</button>
  </div>

  <div id="list"></div>
</div>

<!-- 登录弹窗 -->
<div class="modal" id="loginModal">
  <div class="modal-box">
    <h3 id="loginTitle">登录</h3>
    <input id="email" placeholder="邮箱">
    <input id="pwd" type="password" placeholder="密码">
    <button onclick="login()">登录</button>
    <button onclick="register()">注册</button>
    <button onclick="closeModal()">关闭</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://eewjsxukpcokhazptwhm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_RtMxCp9oXcLS3h8QNzYGQQ_Ym-9JC17";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let user = null;

// 监听登录状态
supabase.auth.onAuthStateChange((e,s)=>{
  user = s.user;
  renderUserBar();
  renderList();
})
async function init(){
  const {data} = await supabase.auth.getUser();
  user = data.user;
  renderUserBar();
  renderList();
}

function renderUserBar(){
  const bar = document.getElementById('user-bar');
  if(user){
    bar.innerHTML = `<p>已登录：${user.email} <button class="btn-logout" onclick="logout()">退出登录</button></p>`
  }else{
    bar.innerHTML = `<p>未登录 <button onclick="openLogin()">去登录</button></p>`
  }
}

function openLogin(){
  document.getElementById('loginModal').style.display='flex';
}
function closeModal(){
  document.getElementById('loginModal').style.display='none';
}

async function login(){
  const email = document.getElementById('email').value;
  const pwd = document.getElementById('pwd').value;
  const {error}=await supabase.auth.signInWithPassword({email,password:pwd})
  if(error) alert(error.message)
  else closeModal()
}
async function register(){
  const email = document.getElementById('email').value;
  const pwd = document.getElementById('pwd').value;
  const {error}=await supabase.auth.signUp({email,password:pwd})
  if(error) alert(error.message)
  else alert("注册成功，请登录");
}
async function logout(){
  await supabase.auth.signOut();
}

async function addDish(){
  if(!user){
    alert("请先登录后再发布菜品！");
    openLogin();
    return;
  }
  const shop = document.getElementById('shop').value.trim();
  const dish = document.getElementById('dish').value.trim();
  if(!shop||!dish) return alert("店铺名和菜品名不能为空");

  const {error}=await supabase.from('dishes').insert({
    user_id:user.id,
    shop_name:shop,
    dish_name:dish
  })
  if(error) alert(error.message)
  else {
    document.getElementById('shop').value=''
    document.getElementById('dish').value=''
    renderList()
  }
}

async function addReview(dishId){
  if(!user){
    alert("请先登录后再评价！");
    openLogin();
    return;
  }
  const rating = prompt("评分（1-5）")
  const comment = prompt("评价内容")
  if(!rating||!comment) return;
  const {error}=await supabase.from('reviews').insert({
    dish_id:dishId,
    user_id:user.id,
    rating:Number(rating),
    comment
  })
  if(error) alert(error.message)
  else renderList()
}

async function renderList(){
  const {data:dishes,err1}=await supabase.from('dishes').select('*').order('created_at',{asc:false})
  const {data:reviews,err2}=await supabase.from('reviews').select('*')
  if(err1||err2) return;

  const html = dishes.map(d=>{
    const rs = reviews.filter(r=>r.dish_id===d.id)
    return `
    <div class="item">
      <h4>${d.shop_name}｜${d.dish_name}</h4>
      <div>
        ${rs.map(x=>`⭐${x.rating} ${x.comment}`).join('<br>')}
      </div>
      <button onclick="addReview('${d.id}')">写评价</button>
    </div>
    `
  }).join('')
  document.getElementById('list').innerHTML = html;
}

init()
</script>
</body>
</html>
